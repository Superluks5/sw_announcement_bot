<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bot Dashboard - Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0f1115;
            color: #e5e5e5;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1d24;
            border: 1px solid #2a2e37;
            border-radius: 8px;
            padding: 32px;
            width: 320px;
        }
        h1 {
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #b91c1c;
            margin: 0 0 20px;
            text-align: center;
        }
        input[type=password] {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #2a2e37;
            background: #0f1115;
            color: #e5e5e5;
            font-size: 14px;
            margin-bottom: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background: #b91c1c;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #991818; }
        .flash-error { color: #f87171; font-size: 13px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛰️ Bot Dashboard</h1>
        <form method="POST">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            <input type="password" name="password" placeholder="Password" autofocus required>
            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
