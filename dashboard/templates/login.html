<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bot Dashboard - Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0f1115;
            color: #e5e5e5;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1a1d24;
            border: 1px solid #2a2e37;
            border-radius: 8px;
            padding: 32px;
            width: 340px;
            text-align: center;
        }
        h1 {
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #b91c1c;
            margin: 0 0 20px;
        }
        .discord-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 4px;
            background: #5865F2;
            color: white;
            font-weight: 600;
            text-decoration: none;
            font-size: 14px;
        }
        .discord-btn:hover { background: #4752c4; }
        .flash-error {
            color: #f87171;
            font-size: 13px;
            margin-bottom: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛰️ Bot Dashboard</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <a class="discord-btn" href="{{ auth_url }}">Log in with Discord</a>
    </div>
</body>
</html>
